<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="A simple and accessible to-do list application built with IBM Carbon Design System">
    <title>My To-Do List</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <!-- Semantic main element for primary content -->
        <main role="main">
            <header>
                <h1>My To-Do List</h1>
            </header>

            <!-- Input section with proper ARIA labels -->
            <section class="input-section" aria-label="Add new task">
                <label for="todoInput" class="visually-hidden">Task description</label>
                <input type="text" id="todoInput" placeholder="Add a new task..." autocomplete="off"
                    aria-label="Enter task description" aria-describedby="inputHelp" maxlength="500">
                <button id="addBtn" aria-label="Add new task">Add</button>
                <span id="inputHelp" class="visually-hidden">Enter a task and press Add or Enter key</span>
            </section>

            <!-- Live region for screen reader announcements -->
            <div id="announcements" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></div>

            <!-- Todo list section with proper ARIA role -->
            <section aria-label="Task list">
                <ul id="todoList" class="todo-list" role="list">
                    <!-- Todo items will be added here dynamically -->
                </ul>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>

</html>
